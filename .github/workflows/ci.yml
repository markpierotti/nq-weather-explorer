name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Build client + server
        run: npm run build

      # Dual-key invariant (AGENTS.md): server-only keys must never reach the browser bundle.
      - name: Guard client bundle against server-only secrets
        run: |
          set -euo pipefail
          scan() { find dist -type f ! -name 'server.cjs' ! -name 'server.cjs.map' -exec grep -nIE "$1" {} +; }
          # Reading a server-only var from client code (plain mentions in UI copy are fine).
          if scan 'env\??\.(GOOGLE_WEATHER_API_KEY|GEMINI_API_KEY|QLDTRAFFIC_API_KEY|VAPID_PRIVATE_KEY)'; then
            echo "::error::Client code reads a server-only env var"
            exit 1
          fi
          # CI has no .env, so VITE_GOOGLE_MAPS_API_KEY is empty here: any key literal means one is hardcoded in source.
          if scan 'AIza[0-9A-Za-z_-]{35}'; then
            echo "::error::Hardcoded Google API key found in client bundle"
            exit 1
          fi
          echo "Client bundle clean."

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nq-weather-explorer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
